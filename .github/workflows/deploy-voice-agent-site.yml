name: Deploy voice agent site

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-voice-agent-site.yml"
      - "voice-agent-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site files
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: voice-agent-site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
