[project]
name = "hotline-eval"
version = "0.1.0"
description = "Eval harness for the Hotline lead-qualification prompt"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
